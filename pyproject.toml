[project]
name = "md-img-local"
version = "1.2.0"
description = "Download images referenced from a Markdown file into media/ and rewrite links to local paths"
readme = "README-EN-US.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests[socks]>=2.31",
    "truststore>=0.8",
]

[tool.uv]
# Проект — одиночный скрипт, устанавливать его как пакет не нужно.
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    # tomllib появился только в Python 3.11, а проект поддерживает 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["helpers", "socks5_proxy", "toml_compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.coverage.run]
include = ["md-img-local.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
